
services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_ROOT_PASSWORD: secret123
      POSTGRES_DB: monapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret123
    ports:
        - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
